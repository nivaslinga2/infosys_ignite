version: "3.8"

services:
  agentshield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentshield-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - QUALCOMM_MODEL=Llama-3.1-8B
      - INFERENCE_CLOUD_ENDPOINT=https://aisuite.cirrascale.com/apis/v2
      # Active Qualcomm Cloud AI 100 credentials:
      - INFERENCE_CLOUD_API_KEY=${INFERENCE_CLOUD_API_KEY:-ebecbacb-9b2c-4484-bbb7-451bd2bd79a0}
      - QUALCOMM_API_KEY=${QUALCOMM_API_KEY:-z0lezzephkyz78wmtembi1q3n5t3tqhlzsl4vxiq}
      - QUALCOMM_TARGET_HARDWARE=${QUALCOMM_TARGET_HARDWARE:-Qualcomm Cloud AI 100}
    volumes:
      # Optional persistence for audit log records across container restarts
      - audit_data:/app/backend/app/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  audit_data:
    driver: local
